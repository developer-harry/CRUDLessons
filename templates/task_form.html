{% extends "base.html" %}

{% block title %}{{ page_title }} | CRUD Lessons{% endblock %}

{% block content %}
    <h2>{{ page_title }}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label for="title">Title</label>
        <input id="title" name="title" value="{{ title }}" maxlength="200" required />

        <label for="details">Details</label>
        <textarea id="details" name="details">{{ details }}</textarea>

        <p><button type="submit">{{ button_text }}</button></p>
    </form>
    <p><a href="{{ url_for('index') }}">Back to tasks</a></p>
{% endblock %}
